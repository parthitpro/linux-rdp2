name: Modern Ubuntu 24.04 Desktop RDP

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Paste fresh Chrome Remote Desktop Auth Command'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Upgrade Prompts, Set IST & Maximize APT Speed
        run: |
          sudo sed -i 's/Prompt=.*/Prompt=never/' /etc/update-manager/release-upgrades
          sudo systemctl mask motd-news.timer 2>/dev/null || true
          
          # Force IST Timezone
          sudo ln -sf /usr/share/zoneinfo/Asia/Kolkata /etc/localtime

          # High-speed parallel APT fetch & bypass disk fsync delays
          echo 'Acquire::Queue-Mode "host";' | sudo tee /etc/apt/apt.conf.d/99parallel
          echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/force-unsafe-io

      - name: Checkout Same Repository to Workspace (Native Git)
        run: |
          git clone --depth=1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" workspace

      - name: Install Desktop, Wallpapers, Yaru Theme & Essential Tools
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            xfce4 \
            xfce4-terminal \
            dbus-x11 \
            xorg \
            xvfb \
            x11-xserver-utils \
            gedit \
            gnome-system-monitor \
            gnome-calculator \
            yaru-theme-gtk \
            yaru-theme-icon \
            ubuntu-wallpapers \
            ubuntu-wallpapers-noble \
            fonts-ubuntu \
            vim \
            ed \
            gawk \
            bc \
            ncal \
            dnsutils \
            net-tools \
            iputils-ping \
            p7zip-full \
            zip \
            unzip

          # Place persistent workspace directly on Desktop
          mkdir -p /home/runner/Desktop
          mv workspace /home/runner/Desktop/workspace
          chown -R runner:runner /home/runner/Desktop/workspace

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm -f google-chrome-stable_current_amd64.deb

      - name: Configure Modern Ubuntu 24.04 Noble Look (Left Dock, Dark Yaru, 12h IST Clock)
        run: |
          mkdir -p /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml

          # 1. Official Yaru-dark theme, Yaru orange icons, and Ubuntu typography
          cat << 'EOF' > /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="Yaru-dark"/>
              <property name="IconThemeName" type="string" value="Yaru"/>
            </property>
            <property name="Gtk" type="empty">
              <property name="FontName" type="string" value="Ubuntu 11"/>
              <property name="MonospaceFontName" type="string" value="Ubuntu Mono 13"/>
            </property>
          </channel>
          EOF

          # 2. Window titlebars & controls (Right-aligned Minimize, Maximize, Close)
          cat << 'EOF' > /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="theme" type="string" value="Yaru-dark"/>
              <property name="button_layout" type="string" value="O|HMC"/>
              <property name="title_font" type="string" value="Ubuntu Bold 11"/>
            </property>
          </channel>
          EOF

          # 3. Ubuntu Desktop Panels: Top Bar with Centered 12h IST Clock & Left Side Ubuntu Dock
          cat << 'EOF' > /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-panel" version="1.0">
            <property name="configver" type="int" value="2"/>
            <property name="panels" type="array">
              <value type="int" value="1"/>
              <value type="int" value="2"/>
            </property>
            <property name="dark-mode" type="bool" value="true"/>
            <property name="panel-1" type="empty">
              <property name="position" type="string" value="p=6;x=0;y=0"/>
              <property name="length" type="uint" value="100"/>
              <property name="position-locked" type="bool" value="true"/>
              <property name="size" type="uint" value="28"/>
              <property name="plugin-ids" type="array">
                <value type="int" value="1"/>
                <value type="int" value="2"/>
                <value type="int" value="3"/>
                <value type="int" value="4"/>
              </property>
            </property>
            <property name="panel-2" type="empty">
              <property name="position" type="string" value="p=8;x=0;y=28"/>
              <property name="length" type="uint" value="100"/>
              <property name="position-locked" type="bool" value="true"/>
              <property name="size" type="uint" value="54"/>
              <property name="mode" type="uint" value="1"/>
              <property name="plugin-ids" type="array">
                <value type="int" value="5"/>
                <value type="int" value="6"/>
                <value type="int" value="7"/>
                <value type="int" value="8"/>
                <value type="int" value="9"/>
              </property>
            </property>
            <property name="plugins" type="empty">
              <property name="plugin-1" type="string" value="applicationsmenu"/>
              <property name="plugin-2" type="string" value="separator">
                <property name="expand" type="bool" value="true"/>
                <property name="style" type="uint" value="0"/>
              </property>
              <property name="plugin-3" type="string" value="clock">
                <property name="digital-time-format" type="string" value="%a %d %b  %I:%M %p"/>
                <property name="digital-format" type="string" value="%a %d %b  %I:%M %p"/>
              </property>
              <property name="plugin-4" type="string" value="actions"/>
              <property name="plugin-5" type="string" value="launcher">
                <property name="items" type="array">
                  <value type="string" value="xfce4-terminal.desktop"/>
                </property>
              </property>
              <property name="plugin-6" type="string" value="launcher">
                <property name="items" type="array">
                  <value type="string" value="google-chrome.desktop"/>
                </property>
              </property>
              <property name="plugin-7" type="string" value="launcher">
                <property name="items" type="array">
                  <value type="string" value="thunar.desktop"/>
                </property>
              </property>
              <property name="plugin-8" type="string" value="launcher">
                <property name="items" type="array">
                  <value type="string" value="gedit.desktop"/>
                </property>
              </property>
              <property name="plugin-9" type="string" value="launcher">
                <property name="items" type="array">
                  <value type="string" value="gnome-system-monitor.desktop"/>
                </property>
              </property>
            </property>
          </channel>
          EOF

          # 4. Set Official Ubuntu 24.04 (Noble Numbat) Dark Wallpaper
          WALLPAPER="/usr/share/backgrounds/Numbat_wallpaper_dimmed_3480x2160.png"
          cat << EOF > /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-desktop" version="1.0">
            <property name="backdrop" type="empty">
              <property name="screen0" type="empty">
                <property name="monitor0" type="empty">
                  <property name="image-path" type="string" value="$WALLPAPER"/>
                  <property name="last-image" type="string" value="$WALLPAPER"/>
                  <property name="image-style" type="int" value="5"/>
                  <property name="workspace0" type="empty">
                    <property name="color-style" type="int" value="0"/>
                    <property name="image-style" type="int" value="5"/>
                    <property name="last-image" type="string" value="$WALLPAPER"/>
                  </property>
                </property>
              </property>
            </property>
          </channel>
          EOF

          # 5. Ubuntu Dark Terminal Theme Configuration
          mkdir -p /home/runner/.config/xfce4/terminal
          cat << 'EOF' > /home/runner/.config/xfce4/terminal/terminalrc
          [Configuration]
          FontName=Ubuntu Mono 13
          ColorPalette=#2e3436;#cc0000;#4e9a06;#c4a000;#3465a4;#75507b;#06989a;#d3d7cf;#555753;#ef2929;#8ae234;#fce94f;#729fcf;#ad7fa8;#34e2e2;#eeeeec
          ColorForeground=#eeeeec
          ColorBackground=#171421
          ColorCursor=#eeeeec
          TabActivityColor=#e95420
          EOF

          chown -R runner:runner /home/runner/.config

      - name: Download & Install Chrome Remote Desktop
        run: |
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg --install chrome-remote-desktop_current_amd64.deb || sudo apt-get install -f -y
          rm -f chrome-remote-desktop_current_amd64.deb

      - name: Configure Stable Desktop Session
        run: |
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'
          echo 'export CHROME_REMOTE_DESKTOP_DEFAULT_DESKTOP_SIZES=1920x1080' | sudo tee -a /etc/environment

      - name: Start Chrome Remote Desktop Host
        run: |
          # Force clean, fixed device name 'Ubuntu-24-Dev' on dashboard
          RAW_CMD="${{ github.event.inputs.crd_code }}"
          FINAL_CMD=$(echo "$RAW_CMD" | sed 's/--name=\$(hostname)/--name="Ubuntu-24-Dev"/')
          eval "$FINAL_CMD --pin=123456"

      - name: Keep-Alive Loop
        run: |
          echo "Ubuntu Desktop RDP is active! PIN is: 123456"
          sleep 21600

      - name: Auto-Commit and Push Work on Exit
        if: always()
        run: |
          cd /home/runner/Desktop/workspace
          git config user.name "GitHub Actions Runner"
          git config user.email "runner@github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-save session work [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to save."
          fi
