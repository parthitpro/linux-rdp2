name: Ubuntu Desktop RDP

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Paste fresh Chrome Remote Desktop Auth Command'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Upgrade Notifications, Set IST & Optimize APT
        run: |
          sudo sed -i 's/Prompt=.*/Prompt=never/' /etc/update-manager/release-upgrades
          sudo systemctl mask motd-news.timer 2>/dev/null || true

          # Set Timezone to IST (Asia/Kolkata)
          sudo ln -sf /usr/share/zoneinfo/Asia/Kolkata /etc/localtime

          # Enable fast parallel downloads & unsafe io
          echo 'Acquire::Queue-Mode "host";' | sudo tee /etc/apt/apt.conf.d/99parallel
          echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/force-unsafe-io

      - name: Checkout Same Repository to Workspace (Native Git)
        run: |
          git clone --depth=1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" workspace

      - name: Install Desktop, Tools & Course Utilities
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            xfce4 \
            xfce4-terminal \
            dbus-x11 \
            xorg \
            xvfb \
            x11-xserver-utils \
            gedit \
            gnome-system-monitor \
            gnome-calculator \
            yaru-theme-gtk \
            yaru-theme-icon \
            ubuntu-wallpapers \
            ubuntu-wallpapers-noble \
            fonts-ubuntu \
            vim \
            ed \
            gawk \
            bc \
            ncal \
            dnsutils \
            net-tools \
            iputils-ping \
            p7zip-full \
            zip \
            unzip

          # Place workspace directory directly on the Desktop
          mkdir -p /home/runner/Desktop
          mv workspace /home/runner/Desktop/workspace
          chown -R runner:runner /home/runner/Desktop/workspace

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm -f google-chrome-stable_current_amd64.deb

      - name: Pre-Configure Dark Theme, 12h Clock & Noble Wallpaper
        run: |
          mkdir -p /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml

          # Set Yaru-dark theme and Ubuntu Mono font
          cat << 'EOF' > /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="Yaru-dark"/>
              <property name="IconThemeName" type="string" value="Yaru"/>
            </property>
            <property name="Gtk" type="empty">
              <property name="MonospaceFontName" type="string" value="Ubuntu Mono 13"/>
            </property>
          </channel>
          EOF

          # Window buttons and borders (Minimize, Maximize, Close on right)
          cat << 'EOF' > /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="theme" type="string" value="Yaru-dark"/>
              <property name="button_layout" type="string" value="O|HMC"/>
            </property>
          </channel>
          EOF

          # 12-Hour Clock Format
          cat << 'EOF' > /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-panel" version="1.0">
            <property name="plugins" type="empty">
              <property name="plugin-5" type="empty">
                <property name="digital-time-format" type="string" value="%I:%M %p"/>
                <property name="digital-format" type="string" value="%I:%M %p"/>
              </property>
            </property>
          </channel>
          EOF

          # Official Noble dimmed wallpaper
          WALLPAPER="/usr/share/backgrounds/Numbat_wallpaper_dimmed_3480x2160.png"
          cat << EOF > /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-desktop" version="1.0">
            <property name="backdrop" type="empty">
              <property name="screen0" type="empty">
                <property name="monitor0" type="empty">
                  <property name="workspace0" type="empty">
                    <property name="color-style" type="int" value="0"/>
                    <property name="image-style" type="int" value="5"/>
                    <property name="last-image" type="string" value="$WALLPAPER"/>
                  </property>
                </property>
              </property>
            </property>
          </channel>
          EOF

          chown -R runner:runner /home/runner/.config

      - name: Download & Install Chrome Remote Desktop
        run: |
          wget -q https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg --install chrome-remote-desktop_current_amd64.deb || sudo apt-get install -f -y
          rm -f chrome-remote-desktop_current_amd64.deb

      - name: Configure Desktop Session
        run: |
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'
          echo 'export CHROME_REMOTE_DESKTOP_DEFAULT_DESKTOP_SIZES=1920x1080' | sudo tee -a /etc/environment

      - name: Start Chrome Remote Desktop Host
        run: |
          eval "${{ github.event.inputs.crd_code }} --pin=123456"

      - name: Keep-Alive Loop
        run: |
          echo "Remote Desktop is active! PIN is: 123456"
          sleep 21600

      - name: Auto-Commit and Push Work on Exit
        if: always()
        run: |
          cd /home/runner/Desktop/workspace
          git config user.name "GitHub Actions Runner"
          git config user.email "runner@github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-save session work [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to save."
          fi
