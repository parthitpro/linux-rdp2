name: Ubuntu Official GNOME RDP

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Paste fresh Chrome Remote Desktop Auth Command'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Release Upgrade Notifications
        run: |
          sudo sed -i 's/Prompt=.*/Prompt=never/' /etc/update-manager/release-upgrades
          sudo systemctl mask motd-news.timer 2>/dev/null || true

      - name: Checkout Same Repository to Workspace
        uses: actions/checkout@v4
        with:
          path: workspace

      - name: Install Desktop, Tools, and Course Utilities
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            ubuntu-desktop-minimal \
            gnome-terminal \
            gnome-shell-extension-ubuntu-dock \
            gnome-shell-extension-desktop-icons-ng \
            nautilus \
            gedit \
            gnome-system-monitor \
            gnome-calculator \
            gnome-characters \
            yaru-theme-gnome-shell \
            yaru-theme-gtk \
            yaru-theme-icon \
            ubuntu-wallpapers \
            ubuntu-wallpapers-noble \
            fonts-ubuntu \
            fonts-firacode \
            fonts-dejavu-core \
            dbus-x11 \
            git \
            vim \
            ed \
            gawk \
            bc \
            ncal \
            dnsutils \
            net-tools \
            iputils-ping \
            hwinfo \
            lshw \
            hdparm \
            sysstat \
            build-essential \
            zip \
            unzip \
            bzip2 \
            p7zip-full \
            cron \
            at \
            curl \
            wget

          # Move repository workspace directly to Desktop
          mkdir -p /home/runner/Desktop
          mv workspace /home/runner/Desktop/workspace
          chown -R runner:runner /home/runner/Desktop/workspace

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          rm -f google-chrome-stable_current_amd64.deb

      - name: Pre-Configure GNOME Defaults with D-Bus Wrapping
        run: |
          dbus-run-session -- bash << 'EOF'
          # Apply dark theme and Ubuntu Mono typography
          gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
          gsettings set org.gnome.desktop.interface gtk-theme 'Yaru-dark'
          gsettings set org.gnome.desktop.interface monospace-font-name 'Ubuntu Mono 13'

          # Enable Minimize, Maximize, and Close buttons on top-right (Windows style)
          gsettings set org.gnome.desktop.wm.preferences button-layout ':minimize,maximize,close'

          # Enable extensions
          gnome-extensions enable ding@rastersoft.com || true
          gnome-extensions enable ubuntu-dock@ubuntu.com || true

          # Move dock to BOTTOM and pin Terminal + Chrome + Files
          gsettings set org.gnome.shell.extensions.dash-to-dock dock-position 'BOTTOM' || true
          gsettings set org.gnome.shell.extensions.dash-to-dock extend-height false || true
          gsettings set org.gnome.shell favorite-apps "['org.gnome.Terminal.desktop', 'google-chrome.desktop', 'org.gnome.Nautilus.desktop', 'gedit.desktop', 'gnome-system-monitor.desktop']" || true

          # Set official Noble background
          gsettings set org.gnome.desktop.background picture-uri 'file:///usr/share/backgrounds/Numbat_wallpaper_dimmed_3480x2160.png'
          gsettings set org.gnome.desktop.background picture-uri-dark 'file:///usr/share/backgrounds/Numbat_wallpaper_dimmed_3480x2160.png'
          gsettings set org.gnome.desktop.background picture-options 'zoom'
          EOF

      - name: Download & Install Chrome Remote Desktop
        run: |
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo dpkg --install chrome-remote-desktop_current_amd64.deb || sudo apt-get install -f -y
          rm -f chrome-remote-desktop_current_amd64.deb

      - name: Configure GNOME Session and Screen Resolution
        run: |
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/gnome-session" > /etc/chrome-remote-desktop-session'
          echo 'export CHROME_REMOTE_DESKTOP_DEFAULT_DESKTOP_SIZES=1920x1080' | sudo tee -a /etc/environment

      - name: Start Chrome Remote Desktop Host
        run: |
          ${{ github.event.inputs.crd_code }} --pin=123456

      - name: Keep-Alive Loop
        run: |
          echo "Ubuntu GNOME RDP is active! PIN is: 123456"
          sleep 21600

      - name: Auto-Commit and Push Work on Exit
        if: always()
        run: |
          cd /home/runner/Desktop/workspace
          git config user.name "GitHub Actions Runner"
          git config user.email "runner@github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-save session work [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to save."
          fi
